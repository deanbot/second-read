# Runs `npm test` on every pull request and push to main. The `tests` job is the check a ruleset requires: it
# passes when the tests passed on every Node version, or when the change touched only Markdown files.
# Setting the repository variable CI_ENABLED to false switches CI off; see AGENTS.md.
name: CI

on:
  # `edited` includes a change of base branch, which changes what a pull request merges without a new push. It
  # also fires on title and body edits; the workflow reads neither.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# Both jobs below use the pull request's head and base from the event, not GitHub's merge commit: that is made
# when the event fires and isn't remade when the base branch changes, so a retargeted pull request would be
# checked and tested against its old base.
jobs:
  changes:
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.changed.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Changes from $BASE to $HEAD_SHA"
          node .github/scripts/changed.mjs "$BASE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          tail -n 1 "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  # A skipped job counts as passing for a required check, so this job always runs, and fails unless the tests passed
  # or were skipped for a Markdown-only change: when CI is switched off, a job failed, or the run was cancelled.
  tests:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          OFF: ${{ vars.CI_ENABLED == 'false' }}
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.changes.outputs.tests }}
          TEST: ${{ needs.test.result }}
        run: |
          if [ "$OFF" = true ]; then
            echo "::error::CI is switched off: the repository variable CI_ENABLED is false. AGENTS.md says what to do."
            exit 1
          fi
          if [ "$CHANGES" != success ]; then
            echo "::error::The change check ended with: $CHANGES"
            exit 1
          fi
          if [ "$TESTS" = false ] && [ "$TEST" = skipped ]; then
            echo "Only Markdown files changed, so the tests were skipped."
          elif [ "$TESTS" = true ] && [ "$TEST" = success ]; then
            echo "The tests passed."
          else
            echo "::error::The tests ended with: $TEST"
            exit 1
          fi
